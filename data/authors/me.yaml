bio: |
  Najmeh Nayyer is a Research Assistant. Her research focuses on topics of cognitive and behavioral neuroscience,
  specifically object recognition and conceptual knowledge. Najmeh is passionate about exploring different approaches
  to find her own perspective on understanding the brain. She believes neuroscience is the intersection of her
  interests, so she spends most of her free time self-studying different analytical skills and reading perspectives
  and theories.

